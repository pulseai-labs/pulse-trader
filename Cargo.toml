[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "PulseTrader core engine — domain types, ports, and adapters"
license = "proprietary"
publish = false

# bin/lib split (audit C1): main.rs and lib.rs compile as SEPARATE crates.
# The binary sees only the library's `pub` API (pub fn run), never pub(crate) internals.
[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
# VS-1.1.4 work-1.02: `serde` feature added (NOT a new dep — a feature toggle on
# the EXISTING chrono dep) so the strategy entities' `created_at: DateTime<Utc>`
# fields can `#[derive(Serialize, Deserialize)]` (the `clock` feature alone does
# not bring serde support). Additive — keep-both with 1.01's Cargo edits at merge.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
# WI-1.1.1.02 (binance bulk ingest): HTTP client, archive decode, CSV parse,
# async runtime, and CHECKSUM (SHA256) verification.
# `http2` and `system-proxy` are declared EXPLICITLY: pulsehive-openai 2.0.2 used
# to pull reqwest 0.12 with them unified on, and 3.0.0 no longer pulls reqwest at
# all — without them the Binance client silently loses both (PR #169, F1).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "system-proxy", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
# `signal` (r3.s3.w1): `pulse serve` shuts down gracefully on SIGTERM (the
# service-manager case) as well as SIGINT.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
hex = "0.4"
# WI-1.1.1.04 (parquet persistence).
polars = { version = "0.53", default-features = false, features = ["parquet"] }
directories = "6"
serde_json = "1"
# Shared by WI-02 (CHECKSUM verify) + WI-04 (data_version hash) — reconciled to one version at merge.
sha2 = "0.11"
# WI-1.1.1.05 (CLI): argument parsing via the derive API.
clap = { version = "4", features = ["derive"] }
# VS-1.1.3 work-3.01 (indicator engine): ta-rs supplies the streaming indicator
# primitives (EMA here; RSI/MACD/ATR in 3.02). EXACT `=` pin (NFR-12): an upgrade
# can shift indicator outputs in low decimals → reproducibility break. The pinned
# version is folded into the future engine_fingerprint. Do NOT relax to a caret.
ta = "=0.5.0"
# VS-1.1.4 work-1.01 (sqlite persistence): the embedded DB tier (WAL pool +
# compile-time-checked queries from 1.03). EXACT `=0.8.6` pin (NFR-12 + gate-7
# C7): a caret `0.8` could pull a patch that changes sqlx's `.sqlx` offline-cache
# format → spurious CI `prepare --check` churn and a reproducibility break. The
# pinned version keys 1.03's committed `.sqlx` cache and joins a future dependency
# fingerprint (mirrors the ta-rs `=0.5.0` determinism pin). Do NOT relax to caret.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
# VS-1.1.4 work-1.01: id generator for the ADAPTER only (1.03 mints
# `Uuid::new_v4().to_string()` for StrategyId/VersionId); the domain stays
# uuid-free (1.02 uses String newtypes). A floating major-1 pin is fine — uuid is
# not in the engine/dep fingerprint, unlike sqlx.
uuid = { version = "1", features = ["v4", "serde"] }
# VS-1.3.1 work-1.03: the PulseHive OpenAI-compatible transport backing the GLM
# adapter (README C8 / ADR-0012 thin transport). EXACT `=3.0.0` pin (#164 — the
# first release whose request config can carry `reasoning_effort`); `=` holds the
# dependency determinism discipline. `features = ["openai"]` pulls the -core/-openai
# graph only (NOT -anthropic; since 3.0.0 not -runtime/-db either). Imported ONLY
# from `src/adapters/llm/openai_compat.rs` (the anti-corruption layer — AC-6). Its transitive
# graph must NOT bump rust_decimal/ta/polars (OQ-C lockfile guard).
pulsehive = { version = "=3.0.0", features = ["openai"] }
# VS-1.3.1 work-1.03: macOS Keychain READ accessor for the GLM API key (FR-1 /
# NFR-5, decision 5). Pinned to keyring 3.x: its `Entry::new` + `get_password`
# bind DIRECTLY to the macOS keychain (default features), so no store-registration
# is needed. keyring 4.x split into keyring-core + store crates whose lazy default-
# store init returned `NoDefaultStore` at runtime for our unsigned dev binary
# (caught by the live user-demo at slice close — the offline test masked it by
# mapping any error to LlmError::Config). I/O not math — NOT in any determinism
# fingerprint, so a caret is fine (unlike ta/sqlx). READ path only; the
# `set_password`/verify half is VS-1.3.4's `pulse setup-keys`.
keyring = "3"
# VS-1.3.2 work-2.03: TOML parser for the "moat in DATA" config seam
# (`config/prices.toml` → `PriceTable::from_config`). Deserialization only; the
# per-model Decimal VALUES parse exactly via the existing rust_decimal serde
# (quoted strings in the file, NFR-2 — no float touches a billed figure). I/O
# not math — NOT in any determinism fingerprint, so a caret pin is fine (its
# transitive graph does not bump rust_decimal/ta/polars — OQ-C lockfile guard).
toml = "0.9"
# r1.s1.w2: `getuid()` for the credential file's ownership check (the least-privilege
# control, AC-5) — std has no API for the running user's uid. Already resolved at
# 0.2.186 in Cargo.lock as a transitive dep, so this is a promotion, not a new edge:
# zero lockfile churn and no determinism-fingerprint impact. I/O not math, so a caret
# pin is fine (unlike ta/sqlx). Use it for the uid read ONLY.
libc = "0.2"
# r2.s1.w2 (ADR-0015 delivery ring): the `pulse mcp` stdio server. EXACT `=3.4.0`
# pin — the MCP SDK is the delivery surface's wire contract; `transport-io` adds
# `tokio/io-std` for `rmcp::transport::stdio()` (defaults stay server+macros+base64;
# no http/auth/reqwest pulls). Do NOT relax to a caret.
rmcp = { version = "=3.4.0", features = ["transport-io"] }
# `JsonSchema` derives on the DSL types feed the `pulse://dsl/schema` resource;
# `rust_decimal1` gives `Decimal` its string/number wire schema.
schemars = { version = "1", features = ["rust_decimal1"] }
# ---------------------------------------------------------------------------
# r3.s3.w1 (ADR-0026) — the `pulse serve` server ring.
# ---------------------------------------------------------------------------
# The HTTP surface. axum 0.8 rides the ALREADY-locked hyper 1 / tower 0.5 /
# http 1 graph (survey 4.5 — no version bumps); only the features the server
# needs: http1 + tokio (axum::serve, graceful shutdown) + json (bodies) — and,
# since r3.s3.w2, sse-stream plumbing. axum's SSE itself is feature-free; the
# per-operation stream is a hand-rolled Stream over an mpsc receiver, which
# needs the `futures-core` trait name — ALREADY resolved in Cargo.lock as a
# transitive dep of axum (a promotion, not a new edge, same as getrandom
# below; no version bump, I/O not math).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3"
# D5: the CSPRNG behind token minting — 32 bytes straight from the OS source.
# Already resolved in Cargo.lock as a transitive dep (a promotion, not a new
# edge). I/O not math — not in any determinism fingerprint, so a caret is fine.
getrandom = "0.3"
# D5: the unpadded base64url token encoding (`pt_` + 43 chars). Also already in
# the lock (0.22.1) — a promotion.
base64 = "0.22"

# ---------------------------------------------------------------------------
# r1.s1.w1 (ADR-0020) — the desktop shell.
#
# ADR-0011 (dual-license surface) note: no NEW DIRECT dependency added here is
# copyleft — every direct crate resolves inside `deny.toml`'s permissive-only
# global allow-list (MIT / Apache-2.0 / BSD / ISC / Unicode-3.0 / Zlib). Tauri
# does pull four MPL-2.0 crates TRANSITIVELY (`selectors`, `cssparser`,
# `cssparser-macros`, `dtoa-short`, via tauri-utils/wry -> dom_query); those are
# covered by the scoped named exceptions in `deny.toml`, not the global allow-list
# (see the exceptions there for why file-level MPL-2.0 copyleft doesn't reach this
# proprietary binary). The commercial self-grant is untouched and no new global
# exception was needed. `cargo deny check licenses` is the gate that holds this
# true over time.
#
# `tauri` is the desktop runtime: window, WKWebView, IPC. Its crate name COLLIDES
# with this crate's own `mod tauri` (the outer ring). The module keeps its name
# because ADR-0020's registered touch surface is `src/tauri/**`; the collision is
# resolved at every use site with a leading `::tauri` (extern crate) versus
# `crate::tauri` (our ring). Do NOT rename the dependency: the `#[tauri::command]`
# and `generate_handler!` macros expand to hard-coded `::tauri::` paths.
tauri = { version = "2", features = ["specta"] }
# The typed seam (ADR-0020): `tauri-specta` reflects the command signatures + the
# bus types into `ui/src/bindings.ts`, and AC-8 fails on any regeneration diff.
#
# EXACT `=` pins, for ONE reason now (r1.s5 closed the second):
#  1. specta 2 and tauri-specta 2 are both PRE-RELEASE (`-rc.N`), and an rc bump
#     changes generated-TypeScript output. A caret would let a background
#     `cargo update` silently rewrite the committed bindings and red AC-8 with no
#     source change. Same reasoning as the ta-rs/sqlx determinism pins, applied to
#     a generated artifact instead of a numeric one.
#  2. (retired by r1.s5.w1/w2) The newest specta used to not build on this crate's
#     pinned toolchain: rc.24+ needs `core::fmt::from_fn` (the unstable
#     `debug_closure_helpers` feature, rust-lang#117729), which was not stable on
#     the old 1.92.0 pin. `r1.s5.w1` moved `rust-toolchain.toml` to 1.98.0 and
#     verified `core::fmt::from_fn` compiles there; this item (`r1.s5.w2`) is the
#     one that actually moves these three pins onto the newest published trio.
#     tauri-specta HARD-pins its specta (`specta = "=2.0.0-rc.N"`), so the pair
#     still has to move together — re-resolve, don't assume the numbers align.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# VS-1.2.3 work-3.01: the build-time engine_fingerprint script (build.rs) hashes
# the four D5 inputs. `sha2`/`hex` reuse the versions ALREADY resolved in Cargo.lock
# as direct/transitive deps (sha2 "0.11", hex "0.4") — no lockfile churn. These are
# build-script-only and do NOT enter the crate's runtime dependency surface.
[build-dependencies]
sha2 = "0.11"
hex = "0.4"
# r1.s1.w1 (ADR-0020): `tauri_build::build()` reads `tauri.conf.json`, emits the
# platform metadata `tauri::generate_context!` consumes, and re-runs the build when
# the config or the frontend dist changes. Build-script-only — it never enters the
# crate's runtime dependency surface (same discipline as sha2/hex above).
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# WI-1.1.1.04 — tests write to a tempfile dir, never real Application Support.
tempfile = "3"
# VS-1.1.2 work-2.01 — property-based DSL serde round-trip harness (dev-only;
# not in engine_fingerprint, so a floating "1" pin is fine).
proptest = "1"
# VS-1.2.3 work-3.04 — the 100x-parallel arm of the determinism proof
# (`tests/determinism.rs`): `into_par_iter` runs `run_backtest` concurrently over
# the REUSED golden fixture to exercise reentrancy (audit C4: no shared mutable
# state). DEV-ONLY — never enters the runtime dep surface or the engine_fingerprint,
# so a floating major-1 pin ("1") is fine (mirrors proptest/tempfile).
rayon = "1"
# r2.s1.w2: the mcp_stdio test drives a real child process through rmcp's client
# side (`TokioChildProcess`) — same exact pin as the server SDK above.
rmcp = { version = "=3.4.0", features = ["client", "transport-child-process"] }

# Lints: deny(warnings) + clippy all + pedantic (MASTER-SPEC §7.1, audit C4).
# unwrap/expect denied so library paths cannot panic (audit C5 / AC-7).
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
