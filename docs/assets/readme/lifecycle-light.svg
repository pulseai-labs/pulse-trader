<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-label="A target becomes a DSL strategy, the Rust engine backtests it, a coach proposes one change per loop, walk-forward and a fenced holdout decide whether it counts, and a certified version can go to paper.">
<title>PulseTrader lifecycle</title>
