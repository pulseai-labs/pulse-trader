<text x="28" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">A wf-v2 search-span pass alone certifies nothing. Paper trading steps live closed bars; it places no orders.</text>
<text x="28" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">Engine: src/adapters/backtest · composer and coach: src/agent · paper runtime: src/application/paper_runtime.rs</text>
