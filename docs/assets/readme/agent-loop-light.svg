<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Claude Code speaks MCP to pulse mcp; the twenty tools call the same application use cases the app uses, against one SQLite database and one Parquet store, with the holdout fence on every run, export and mark.">
<title>PulseTrader agent loop</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
</defs>
<rect width="880" height="450" fill="#ffffff"/>
<text x="28" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2328" text-anchor="start" opacity="1.0">Drive it from Claude Code</text>
<text x="28" y="61" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">pulse mcp is an MCP server. The agent gets the same use cases and the same database as the app, and no more.</text>
<rect x="24" y="98" width="180" height="96" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
<text x="114.0" y="143.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Claude Code</text>
<text x="114.0" y="161.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">MCP client</text>
<rect x="248" y="98" width="190" height="96" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
<text x="343.0" y="135.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">pulse mcp</text>
<text x="343.0" y="153.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">--local: stdio, local DB</text>
<text x="343.0" y="165.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">or relay to /mcp</text>
<line x1="206" y1="146" x2="244" y2="146" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="225" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#59636e" text-anchor="middle" opacity="1.0">MCP</text>
<rect x="482" y="78" width="374" height="140" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="498" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" opacity="1.0">Twenty tools</text>
<text x="498" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">reads · library, versions, runs, paper, exports</text>
<text x="498" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">writes · submit_strategy_version, run_backtest,</text>
<text x="498" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">         run_walk_forward, certify_version</text>
<text x="498" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">marks · write, list, withdraw, explain_marks</text>
<text x="498" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">resource · pulse://dsl/schema</text>
<line x1="440" y1="146" x2="478" y2="146" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="456" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#59636e" text-anchor="middle" opacity="1.0">tools</text>
<rect x="482" y="252" width="374" height="76" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
<text x="669.0" y="287.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Application use cases</text>
<text x="669.0" y="305.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">one implementation per tool — the app calls the same code</text>
<line x1="669" y1="220" x2="669" y2="248" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="248" y="252" width="190" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
<text x="343.0" y="287.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">SQLite + Parquet</text>
<text x="343.0" y="305.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">one database, one store</text>
<line x1="478" y1="290" x2="442" y2="290" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="360" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">with --local</text>
<line x1="338" y1="174" x2="338" y2="248" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="346" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">relay: HTTP /mcp</text>
<rect x="24" y="364" width="832" height="52" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="40" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#cf222e" text-anchor="start" opacity="1.0">Holdout fence</text>
<text x="152" y="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" opacity="1.0">while a freeze is open, every persisted run, export, chart read and mark stops at its start.</text>
<text x="40" y="405" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">Power reviews are operator-only and are never readable over MCP; no tool promotes, stops or sweeps a paper session.</text>
</svg>
