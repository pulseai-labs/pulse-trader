<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" width="880" height="644" role="img" aria-label="The search span is walked forward under wf-v2; a fenced holdout, a fixed hypothesis budget and a power review gate one certification record that is immutable whatever the outcome.">
<title>PulseTrader honesty gates</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
</defs>
<rect width="880" height="644" fill="#ffffff"/>
<text x="28" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2328" text-anchor="start" opacity="1.0">Honest by construction</text>
<text x="28" y="61" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">The search span and the holdout are separated before any candidate exists, and the gate is fixed before a result is seen.</text>
<rect x="24" y="84" width="320" height="68" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
<text x="184.0" y="107.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Search span</text>
<text x="184.0" y="125.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">every bar before the freeze's holdout start</text>
<text x="184.0" y="137.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">persisted wf-v2 runs</text>
<rect x="24" y="170" width="320" height="68" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
<text x="184.0" y="193.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">wf-v2 on K folds</text>
<text x="184.0" y="211.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">fold holds: n ≥ 20 and mean R &gt; 0</text>
<text x="184.0" y="223.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">run passes: ≥ ⌈2K/3⌉ folds and pooled bound &gt; 0</text>
<rect x="24" y="256" width="320" height="68" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
<text x="184.0" y="287.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Candidate</text>
<text x="184.0" y="305.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">a search-span pass is not a certificate</text>
<rect x="24" y="360" width="320" height="68" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
<text x="184.0" y="383.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Holdout backtest</text>
<text x="184.0" y="401.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">one run, never persisted</text>
<text x="184.0" y="413.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">no holdout trades are readable</text>
<rect x="24" y="446" width="320" height="68" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
<text x="184.0" y="469.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">C1 test</text>
<text x="184.0" y="487.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">z = z(1 − 0.05/H); pass when the lower bound &gt; 0</text>
<text x="184.0" y="499.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">at least two holdout trades</text>
<rect x="24" y="532" width="320" height="68" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
<text x="184.0" y="555.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Certification row</text>
<text x="184.0" y="573.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">immutable, written whatever the outcome</text>
<text x="184.0" y="585.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">certified = search pass AND holdout pass</text>
<line x1="184" y1="154" x2="184" y2="166" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="184" y1="240" x2="184" y2="252" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="320" y1="326" x2="320" y2="356" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<line x1="24" y1="352" x2="344" y2="352" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="184" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cf222e" text-anchor="middle" opacity="1.0">holdout fence — never reused</text>
<line x1="184" y1="430" x2="184" y2="442" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="184" y1="516" x2="184" y2="528" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="396" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" opacity="1.0">Fixed before any candidate is seen</text>
<rect x="396" y="96" width="460" height="92" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
<text x="626.0" y="131.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Freeze</text>
<text x="626.0" y="149.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">one open at a time; terms fixed by trigger</text>
<text x="626.0" y="161.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">a new holdout starts after the last close</text>
<rect x="396" y="208" width="460" height="92" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="626.0" y="243.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Hypothesis budget H</text>
<text x="626.0" y="261.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">1 to 12, set at the freeze</text>
<text x="626.0" y="273.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">lower-only: never raised, never moved after a result</text>
<rect x="396" y="320" width="460" height="92" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="626.0" y="355.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle" opacity="1.0">Power review</text>
<text x="626.0" y="373.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">holdout trade count and pass chance at +0.25R</text>
<text x="626.0" y="385.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" opacity="1.0">an attempt needs ≥ 50% and ≥ 20 holdout trades</text>
<rect x="396" y="442" width="460" height="106" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
<text x="412" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" opacity="1.0">The gate is never loosened after a result</text>
<text x="412" y="490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">A rule's constants are the rule: change one and it is</text>
<text x="412" y="507" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">a new rule name, never an edit to a stored verdict.</text>
<text x="412" y="528" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">A freeze's terms never change; certification rows are immutable.</text>
<text x="28" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" opacity="1.0">A refused or errored certify call spends no hypothesis and writes no certification row.</text>
</svg>
