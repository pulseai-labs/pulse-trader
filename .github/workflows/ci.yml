name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + nextest
    runs-on: macos-latest
    # VS-1.1.4 work-1.01: build offline (belt-and-suspenders with
    # `.cargo/config.toml`) so a stray DATABASE_URL/.env can't override the
    # committed `.sqlx` cache. The embedded `MIGRATOR` needs no live DB/sqlx-cli.
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install toolchain (pinned via rust-toolchain.toml)
        run: rustup show

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9  # v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (nextest)
        run: cargo nextest run

  # VS-1.1.4 work-1.01 (NFR-12): fail on a STALE committed `.sqlx` cache. With no
  # `query!` macros yet (1.03 adds them), `--check` against the bootstrap cache is
  # a no-op pass; this job is the gate 1.03's generated cache must satisfy. It
  # installs sqlx-cli (a developer-local tool, NOT in the `check` job) and runs
  # the check against a throwaway migrated DB.
  prepare-check:
    name: sqlx prepare --check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup show
      - name: Install sqlx-cli (pinned to the project sqlx version)
        # Pin to the version Cargo.toml exact-pins (`sqlx =0.8.6`): the committed
        # `.sqlx` cache is keyed to that version, and an unpinned `cargo install`
        # would pick up whatever sqlx-cli is newest, which can drift out of sync
        # with the pinned `sqlx` crate and produce a cache mismatch unrelated to
        # the PR. `--locked` keeps sqlx-cli's own transitive deps from churning CI
        # for the same reason.
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite,rustls
      - name: Create + migrate throwaway DB
        run: |
          DATABASE_URL=sqlite://ci-prepare.db sqlx database create
          DATABASE_URL=sqlite://ci-prepare.db sqlx migrate run
      - name: sqlx prepare --check
        run: DATABASE_URL=sqlite://ci-prepare.db cargo sqlx prepare --check

  private-docs-guard:
    name: private-docs-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-no-private-docs.sh

  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2

  # VS-1.2.3 work-3.04 (NFR-2, BACKLOG-12): the determinism gate. Runs the
  # 100x-sequential + 100x-Rayon-parallel determinism test on Linux BOTH ARCHES —
  # ubuntu-latest (x86_64) + ubuntu-24.04-arm (arm64) — because the property under
  # test is about CPU ARCH, not OS (D4); x86_64 is retained as the FP-hygiene
  # forcing function (the arch most likely to expose stray FMA/x87 contraction).
  # apple-darwin determinism is deferred to a release/nightly workflow (#62), NOT
  # every PR — do not add darwin arches here. Runs `--release` (gate-2 grill): the
  # cross-arch CI compare is the AUTHORITATIVE gate, so it must prove the SHIPPED
  # codegen profile (the `.app` ships `--release`); the local
  # `cargo test --test determinism` AC stays debug (fast, in-process 100x-identity).
  # The emitter WRITES the single canonical content hash to a FILE
  # (target/determinism-hash.txt) — uploaded as the per-arch artifact; no stdout
  # scraping. The dependent `determinism-crossarch` job downloads both and cmp's
  # them: byte-equality across arches = the live AC#1 cross-arch proof (#29).
  determinism:
    name: determinism (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      # This job runs `--release` for ship-faithful codegen (see above) but has no
      # Node/frontend toolchain, so `ui/dist/index.html` never exists here.
      # `build.rs`'s `ensure_frontend_dist` panics on a missing dist in a release
      # profile unless this is set — legitimately, since the binary this job
      # produces is a throwaway test binary, never a distributed artifact.
      PULSE_ALLOW_PLACEHOLDER_DIST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install toolchain (pinned via rust-toolchain.toml)
        run: rustup show

      # r1.s1 (w1) brought the Tauri desktop ring into the crate, and on Linux the
      # `tauri` dependency compiles against the GTK/webkit system stack — without
      # these dev packages `gobject-sys` fails pkg-config ("Package 'gobject-2.0'
      # … not found") before any test runs. This job compiles the whole crate
      # (the test links the lib, whose `mod tauri` pulls the dependency in), so
      # it needs Tauri v2's documented Linux prerequisites.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # Ship-faithful (gate-2): the cross-arch gate runs the profile the .app
      # ships (`--release`), so a release-only auto-vectorization divergence
      # cannot ship unproven. 100x sequential + 100x Rayon, all 200 hashes equal.
      - name: Determinism test (--release, 100x single + parallel)
        run: cargo test --release --test determinism

      # Tamper-proof transport: the emitter WRITES the one canonical
      # result_content_hash() to target/determinism-hash.txt (no --nocapture
      # scraping). D3 fallback if this ever diverges cross-arch on the f64 regime:
      # swap result_content_hash() -> money_math_hash() in tests/determinism.rs and
      # this run is unchanged.
      - name: Emit canonical content hash to file (--release)
        run: cargo test --release --test determinism emit_content_hash -- --ignored

      - name: Upload per-arch determinism hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: determinism-hash-${{ matrix.arch }}
          path: target/determinism-hash.txt
          if-no-files-found: error

  # VS-1.2.3 work-3.04: the live AC#1 cross-arch proof. Downloads BOTH arches'
  # determinism-hash.txt and cmp's them byte-for-byte — EQUAL ⇒ the two arches
  # produced the SAME content hash (closes #29's cross-arch half). RED here on the
  # f64 regime component is the signal to apply the D3 fallback (regime-free
  # money_math_hash()) and file a narrowed #29.
  determinism-crossarch:
    name: determinism cross-arch compare
    needs: determinism
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download x86_64 hash
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: determinism-hash-x86_64
          path: x86_64

      - name: Download arm64 hash
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: determinism-hash-arm64
          path: arm64

      - name: Compare cross-arch content hashes (byte-equal = AC#1 proof)
        run: |
          echo "x86_64: $(cat x86_64/determinism-hash.txt)"
          echo "arm64:  $(cat arm64/determinism-hash.txt)"
          cmp x86_64/determinism-hash.txt arm64/determinism-hash.txt

  # Review-finding fix (Codex P2 justfile:18 + CodeRabbit justfile:78 +
  # CodeRabbit scripts/check-adr-0022.sh:12): the `check` job above never ran
  # `just check` and never touched the frontend, so `ui/`'s typecheck, vitest
  # suite, and production build, plus ALL EIGHT of the desktop shell's content
  # gates (`just gates`), passed or failed on NOBODY -- combined with build.rs's
  # release-only placeholder-dist guard, a required-green CI could ship a broken
  # or stale frontend underneath a passing Rust build. This job is that missing
  # verification, run directly (see the note below on why not `just check`).
  frontend-and-gates:
    name: frontend + gates
    runs-on: macos-latest
    # `check-bindings.sh` drives `cargo run --example export-bindings`, which
    # compiles the crate -- mirror the `check` job's offline guard so a stray
    # DATABASE_URL/.env can't override the committed `.sqlx` cache here either.
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install toolchain (pinned via rust-toolchain.toml)
        run: rustup show

      # The version comes from `.nvmrc`, not a literal here, so `nvm use` and
      # this job read the SAME pin and a green local `just check` means what a
      # green CI run means. The floor is Node 22: jsdom 30's undici calls
      # `webidl.util.markAsUncloneable`, which does not exist before it, so the
      # whole vitest suite dies on import under Node 20.
      - name: Install Node (pinned via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install node modules (lockfile-authoritative)
        run: npm ci

      # Explicit steps, not `just check`: `just check` also re-runs `fmt`,
      # `clippy`, and `test` (nextest), which the `check` job above already
      # covers -- duplicating them here would just burn CI minutes on Rust work
      # this job isn't the gate for. This runs only the part of `just check`
      # that is ACTUALLY missing: the frontend triad and the eight shell gates
      # (`just ui`'s three steps, then `just gates`'s eight scripts, spelled out
      # to match `just gates`'s own committed order).
      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Test (frontend, vitest run)
        run: npm run test

      - name: Build (frontend, production bundle)
        run: npm run build

      - name: Gate -- ADR-0020 content
        run: bash scripts/check-adr-0020.sh

      - name: Gate -- capabilities
        run: bash scripts/check-capabilities.sh

      - name: Gate -- window config
        run: bash scripts/check-window-config.sh

      - name: Gate -- bindings freshness
        run: bash scripts/check-bindings.sh

      - name: Gate -- design system
        run: bash scripts/check-design-system.sh

      - name: Gate -- shell navigation
        run: bash scripts/check-shell-navigation.sh

      - name: Gate -- ADR-0022 content
        run: bash scripts/check-adr-0022.sh

      - name: Gate -- no specta workaround
        run: bash scripts/check-no-specta-workaround.sh
